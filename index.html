<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To do list Website</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="webHeader">
            <h1>My To-do List</h1>
            <button id="modeToggle" class="modeButt">Mode Toggle</button>
        </header>

        <main class="layoutContainer">
            <!-- Left container -->
            <section class="todoPanel">
                <h2>My Tasks</h2>
                <ul class="list" id="todoList">
                    <!-- Dynamic task items injected via JS -->
                </ul>
            </section>

            <!-- Right panel -->
            <aside class="detailPanel">
                <h2>Task Details</h2>

                <!-- Selected Task View -->
                <div class="selectedTask">
                    <h3 id="detailTitle">Select a task</h3>
                    <p class="taskMeta">
                        <strong>Due:</strong> <span id="detailDate">-</span> | 
                        <strong>Status:</strong> <span id="detailStatus">-</span>
                    </p>
                    <p class="taskDescription" id="detailDesc">Select a task from the left list to view details.</p>
                    
                    <!--Image view-->
                    <img id="detailImage" src="" alt="Task attachments" style="display: none; max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px;" />

                    <!-- Action buttons for selected task -->
                    <div class="actionButtons">
                        <button type="button" id="editBtn" class="actionBtn editBtn">Edit Task</button>
                        <button type="button" id="deleteBtn" class="actionBtn deleteBtn">Delete Task</button>
                    </div>
                </div>

                <hr class="divider">

                <!-- Create/Edit Task Form -->
                <form class="todoDetail" id="todoForm">
                    <h3 id="formHeading">Create a New Task</h3>
                    <div class="taskGroup">
                        <label for="taskTitle">Title</label>
                        <input type="text" id="taskTitle" name="title" placeholder="Enter title..." required>
                    </div>

                    <div class="taskGroup">
                        <label for="taskDesc">Description</label>
                        <textarea id="taskDesc" name="description" rows="4" placeholder="Enter details..."></textarea>
                    </div>

                    <div class="taskGroup">
                        <label for="taskDate">Due date</label>
                        <input type="date" id="taskDate" name="dueDate">
                        <label for="reminderDate">Reminder</label>
                        <input type="datetime-local" id="reminderDate" name="reminderDate">
                    </div>

                    <div class="imageAttachment">
                        <video id="videoElm" autoplay playsinline style="width: 100%; max-width: 400px;"></video>
                        <canvas id="canvasElm" style="display: none;"></canvas>
                        <button type="button" id="camera-Video">Capture Media</button>
                        <button type="button" id="take-picture">Take Photo</button>
                        <img class="captured-img" id="photoPreview" src=""/>
                    </div>

                    <div class="taskGroup">
                        <button type="submit" id="submitBtn" class="submitButton">Add Task</button>
                        <button type="button" id="cancelEditBtn" class="cancelButton" style="display: none;">Cancel Edit</button>
                    <div> <!--ヨミビトシラズ -->
                        
                </form>
            </aside>
        </main>

        <footer class="webFooter">
            <p>This is a footer because it's necessary. Thanks.</p>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
